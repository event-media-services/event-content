<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contenu indisponible</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f6f8;
      color: #202124;
    }

    .container {
      max-width: 620px;
      margin: 0 auto;
      padding: 60px 24px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 36px 28px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }

    h1 {
      font-size: 25px;
      margin: 0 0 14px;
    }

    p {
      color: #5f6368;
      line-height: 1.5;
      margin: 0;
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="card">

      <h1>Contenu indisponible</h1>

      <p>
        Cette page n'est actuellement pas accessible.
      </p>

    </div>
  </div>

  <script
    data-goatcounter="https://event-media-services.goatcounter.com/count"
    async
    src="//gc.zgo.at/count.js">
  </script>

</body>
</html>
